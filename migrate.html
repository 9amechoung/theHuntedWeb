<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 옮기기</title>
<style>
  :root{--ink:#14161b;--ink-2:#474d5a;--paper:#f4f6f9;--panel:#fff;--green:#23804f;--red:#cf3b27}
  @media (prefers-color-scheme: dark){:root{--ink:#eceef3;--ink-2:#b3b9c5;--paper:#0f1115;--panel:#171a20;--green:#4fc184;--red:#f2705b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Malgun Gothic",system-ui,sans-serif;padding:32px 16px}
  main{max-width:560px;margin:0 auto;background:var(--panel);border:2px solid var(--ink);padding:20px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:var(--ink-2);margin:0 0 14px}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
  input{width:100%;padding:8px 10px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);font:inherit}
  button{margin-top:14px;padding:9px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  ol{margin:14px 0 0;padding-left:20px;font-family:Consolas,monospace;font-size:13px}
  .ok{color:var(--green)} .bad{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>claude.ai → Firebase 데이터 옮기기</h1>
  <p>팀 계정으로 로그인한 뒤 <b>옮기기 시작</b>을 한 번만 누르세요. 같은 이름의 항목은 덮어써서, 두 번 눌러도 중복되지 않아요.</p>
  <form id="f">
    <label for="em">이메일</label><input id="em" type="email" autocomplete="username">
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
    <button id="go" type="submit">로그인하고 옮기기 시작</button>
  </form>
  <ol id="log"></ol>
</main>
<script type="module">
import { login, setRaw, putImage, AUTH_MSG } from './firebase.js';
const $ = s => document.querySelector(s);
const log = (t, cls = '') => { const li = document.createElement('li'); li.textContent = t; if (cls) li.className = cls; $('#log').append(li); };
try { $('#em').value = localStorage.getItem('hunted.email') || ''; } catch {}
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  $('#go').disabled = true;
  try { await login($('#em').value.trim(), $('#pw').value); $('#pw').value = ''; }
  catch (x) { log(AUTH_MSG(x && x.code), 'bad'); $('#go').disabled = false; return; }
  log('로그인했어요.', 'ok');
  let n = 0, fail = 0;
  try {
    const data = await (await fetch('./migrate-data.json', {cache: 'no-store'})).json();
    const assetIds = new Set();
    for (const [col, docs] of Object.entries(data)) {
      for (const [id, doc] of Object.entries(docs)) {
        try { await setRaw(col, id, doc); n++; } catch (x) { fail++; log(`${col}/${id} 실패: ${x.message}`, 'bad'); }
        if (col === 'art' && doc.assetId) assetIds.add(doc.assetId);
        if (col === 'reports') (doc.images || []).forEach(i => assetIds.add(i));
      }
      log(`${col}: ${Object.keys(docs).length}개`);
    }
    for (const id of assetIds) {
      try {
        const r = await fetch(`./images/${id}.png`);
        if (!r.ok) throw new Error('images 폴더에 파일이 없어요');
        await putImage(id, await r.blob());
        log(`이미지 ${id.slice(0, 8)}… 올림`, 'ok');
      } catch (x) { fail++; log(`이미지 ${id.slice(0, 8)}… 실패: ${x.message}`, 'bad'); }
    }
    log(fail ? `끝났어요. 문서 ${n}개를 옮겼고 ${fail}개는 실패했어요.` : `끝났어요. 문서 ${n}개와 이미지 ${assetIds.size}장을 옮겼어요.`, fail ? 'bad' : 'ok');
  } catch (x) { log('옮기지 못했어요: ' + x.message, 'bad'); }
  $('#go').disabled = false;
});
</script>
</body>
</html>
